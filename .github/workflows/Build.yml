name: Build Data Balk

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore DataBalkUnitTest/DataBalkUnitTest.csproj

      - name: Build Debug
        run: dotnet build DataBalkTaskLisitAPI.csproj --configuration Debug --no-restore
      - name: Build Release
        run: dotnet build DataBalkTaskLisitAPI.csproj --configuration Release --no-restore



